<!DOCTYPE html>

<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a1a;
            background-image: radial-gradient(circle at 20% 30%, #1a1a3a 0%, #0a0a1a 70%);
            color: #ffffff;
            padding: 20px;
        }
        .card {
            background: rgba(20, 20, 40, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 48px 36px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-4px);
        }
        .logo {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 14px;
            color: #8888aa;
            margin-bottom: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        h1 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 16px;
            line-height: 1.3;
        }
        p {
            font-size: 16px;
            color: #b0b0d0;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #0088cc, #00aaff);
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            padding: 16px 40px;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0, 136, 204, 0.4);
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 32px rgba(0, 136, 204, 0.6);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: #6c5ce7;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #a29bfe;
            text-decoration: underline;
        }
        .note {
            margin-top: 20px;
            font-size: 13px;
            color: #555577;
        }
